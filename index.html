<!DOCTYPE html>
<html lang="en" class="scroll-smooth" style="color-scheme: light;">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light">
    <meta name="description" content="Syed Ali Hashmi - Software Engineer, Full-Stack Developer & AI Automation Specialist. Exploring modern web, Next.js, TypeScript, Python, and Agentic AI." />
    <title>Syed Ali Hashmi | Software Engineer & AI Developer</title>
    
    <!-- Geist and Geist Mono Fonts from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS with CDN and Vercel Geist Config -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: '#171717',
              'on-primary': '#ffffff',
              ink: '#171717',
              body: '#4d4d4d',
              mute: '#8f8f8f',
              faint: '#a1a1a1',
              hairline: '#ebebeb',
              'hairline-soft': '#f2f2f2',
              canvas: '#fafafa',
              'canvas-elevated': '#ffffff',
              link: '#0070f3',
              'link-deep': '#0761d1',
              'link-soft': '#d3e5ff',
              error: '#ee0000',
              'error-deep': '#c50000',
              warning: '#f5a623',
              'warning-soft': '#ffefcf',
              'warning-deep': '#ab570a',
              violet: '#7928ca',
              'violet-soft': '#d8ccf1',
              cyan: '#50e3c2',
              'cyan-soft': '#aaffec',
              pink: '#ff0080',
              magenta: '#eb367f',
            },
            fontFamily: {
              sans: ['Geist', 'Arial', 'sans-serif'],
              mono: ['Geist Mono', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'monospace'],
            },
            borderRadius: {
              sm: '6px',
              md: '12px',
              lg: '16px',
              'pill-category': '64px',
              pill: '100px',
            },
            boxShadow: {
              whisper: '0 1px 2px rgba(0, 0, 0, 0.04)',
              floating: '0 2px 2px rgba(0, 0, 0, 0.04), 0 8px 16px -4px rgba(0, 0, 0, 0.08)',
              'floating-lg': '0 8px 30px rgba(0, 0, 0, 0.12)',
            },
            letterSpacing: {
              'display-xl': '-2.4px',
              'heading-lg': '-1.28px',
              'heading-md': '-0.4px',
              'label-sm': '-0.28px',
            }
          }
        }
      }
    </script>

    <style>
      :root {
        --color-primary: #171717;
        --color-on-primary: #ffffff;
        --color-ink: #171717;
        --color-body: #4d4d4d;
        --color-mute: #8f8f8f;
        --color-faint: #a1a1a1;
        --color-hairline: #ebebeb;
        --color-hairline-soft: #f2f2f2;
        --color-canvas: #fafafa;
        --color-canvas-elevated: #ffffff;
        --color-link: #0070f3;
        --color-link-deep: #0761d1;
        --color-link-soft: #d3e5ff;
        color-scheme: light;
        scrollbar-color: #d4d4d4 #fafafa;
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family: 'Geist', Arial, sans-serif;
        background-color: #fafafa;
        color: #4d4d4d;
        overflow-x: hidden;
      }

      code, pre, .font-mono {
        font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      /* Typography Enhancements */
      h1, h2, h3, h4, h5, h6 {
        text-wrap: balance;
      }

      p, li, blockquote {
        text-wrap: pretty;
      }

      /* Custom Subtle Scrollbar */
      @supports not (scrollbar-color: auto) {
        ::-webkit-scrollbar {
          width: 7px;
        }
        ::-webkit-scrollbar-track {
          background: #fafafa; 
        }
        ::-webkit-scrollbar-thumb {
          background: #d4d4d4;
          border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
          background: #a1a1a1;
        }
      }

      /* Vercel Multi-stop Hero Mesh Gradient */
      .hero-mesh-background {
        position: absolute;
        top: -60px;
        left: 50%;
        transform: translateX(-50%);
        width: 1000px;
        max-width: 95vw;
        height: 520px;
        background: radial-gradient(circle at 20% 30%, rgba(0, 223, 216, 0.22), transparent 45%),
                    radial-gradient(circle at 55% 20%, rgba(0, 124, 240, 0.20), transparent 45%),
                    radial-gradient(circle at 75% 45%, rgba(121, 40, 202, 0.18), transparent 45%),
                    radial-gradient(circle at 40% 70%, rgba(255, 0, 128, 0.16), transparent 45%),
                    radial-gradient(circle at 85% 65%, rgba(249, 203, 40, 0.15), transparent 45%);
        filter: blur(60px);
        pointer-events: none;
        z-index: 0;
      }

      /* Vercel Hairline Cards */
      .feature-card {
        background-color: #ffffff;
        border: 1px solid #ebebeb;
        border-radius: 12px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
        transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
      }
      .feature-card:hover {
        border-color: #171717;
      }

      /* Native Scroll-Driven Animations */
      @media (prefers-reduced-motion: no-preference) {
        @supports ((animation-timeline: view()) and (animation-range: entry)) {
          @keyframes revealEntry {
            from {
              opacity: 0;
              transform: translateY(20px);
            }
            to {
              opacity: 1;
              transform: translateY(0);
            }
          }

          .reveal-on-scroll {
            animation: revealEntry 0.6s cubic-bezier(0.16, 1, 0.3, 1) backwards;
            animation-timeline: view();
            animation-range: entry 5% cover 25%;
          }
        }
      }

      /* Accessible Form Validation */
      .form-input:user-invalid,
      .form-input.user-invalid-fallback {
        border-color: #ee0000 !important;
        box-shadow: 0 0 0 1px #ee0000 !important;
      }

      .form-input:user-valid:not(:placeholder-shown) {
        border-color: #ebebeb !important;
      }

      .form-input:user-invalid ~ .error-message,
      .form-input.user-invalid-fallback ~ .error-message {
        display: block !important;
      }

      /* Vercel Legacy Accent Gradients */
      .text-gradient-develop {
        background: linear-gradient(135deg, #007cf0 0%, #00dfd8 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .text-gradient-preview {
        background: linear-gradient(135deg, #7928ca 0%, #ff0080 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .text-gradient-ship {
        background: linear-gradient(135deg, #ff4d4d 0%, #f9cb28 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "@google/genai": "https://esm.run/@google/genai",
    "@vitejs/plugin-react": "https://aistudiocdn.com/@vitejs/plugin-react@^5.1.0",
    "vite": "https://aistudiocdn.com/vite@^7.2.0"
  }
}
</script>
</head>
<body class="bg-[#fafafa] text-[#4d4d4d] antialiased selection:bg-[#171717] selection:text-white font-sans min-h-screen">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
      // Fallback for scroll-driven animations if not natively supported
      if (!CSS.supports('((animation-timeline: view()) and (animation-range: entry))')) {
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.style.opacity = '1';
              entry.target.style.transform = 'translateY(0)';
              observer.unobserve(entry.target);
            }
          });
        }, { rootMargin: '0px 0px -40px 0px', threshold: 0.1 });

        window.addEventListener('DOMContentLoaded', () => {
          document.querySelectorAll('.reveal-on-scroll').forEach(el => {
            el.style.opacity = '0';
            el.style.transform = 'translateY(16px)';
            el.style.transition = 'opacity 0.5s ease-out, transform 0.5s ease-out';
            observer.observe(el);
          });
        });
      }
    </script>
</body>
</html>
